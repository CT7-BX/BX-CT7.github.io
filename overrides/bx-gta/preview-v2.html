class ClassicMenuBase {
 constructor(maxOptions=10){this.maxOptions=maxOptions;this.lastSubmenu=[];this.lastOption=[];this.maxDepth=20;}
 changeSubmenu(screen,selected){if(this.lastSubmenu.length>=this.maxDepth)return false;this.lastSubmenu.push({...screen});this.lastOption.push(selected);return true;}
 previous(){if(!this.lastSubmenu.length)return null;return {...this.lastSubmenu.pop(),selected:this.lastOption.pop()};}
 move(selected,count,direction){if(!count)return 0;let currentOption=selected+1+direction;if(currentOption<1)currentOption=count;if(currentOption>count)currentOption=1;return currentOption-1;}
 visible(index,selected,count){const first=selected<this.maxOptions?0:selected-this.maxOptions+1;return index>=first&&index<Math.min(count,first+this.maxOptions);}
 scroller(value,min,max,direction,increment=1){return direction>0?(value>=max?min:Math.min(max,value+increment)):(value<=min?max:Math.max(min,value-increment));}
 reset(){this.lastSubmenu=[];this.lastOption=[];}
}
const menuBase=new ClassicMenuBase(10);
function rememberScreen(){return menuBase.changeSubmenu({section:state.section,group:state.group,query:state.query,favOnly:state.favOnly,catalog:state.catalog,advanced:!!state.advanced,recentOnly:!!state.recentOnly},state.selected);}
function rangeSpec(item){if(item.range)return item.range;const t=normalize(item.title);if(t==='tamanho da fonte')return {min:11,max:17,step:1,initial:13,unit:'px'};if(t==='tamanho do painel')return {min:300,max:430,step:10,initial:400,unit:'px'};if(t==='transparencia do painel')return {min:50,max:100,step:5,initial:95,unit:'%'};if(t.includes('campo de visao'))return {min:30,max:120,step:5,initial:70,unit:'°'};return {min:0,max:100,step:1,initial:50,unit:''}}
function applyAppearance(){for(const item of all){if(state.values[item.key]===undefined)continue;const t=normalize(item.title),v=Number(state.values[item.key]);if(t==='tamanho da fonte'&&v>=11&&v<=17)document.documentElement.style.setProperty('--option-size',v+'px');if(t==='tamanho do painel'&&v>=300&&v<=430)document.documentElement.style.setProperty('--menu-width',v+'px');if(t==='transparencia do painel'&&v>=50&&v<=100)document.documentElement.style.setProperty('--menu-alpha',v/100)}}
function adjustSelected(direction){const item=state.rows[state.selected];if(!item)return;const type=kind(item);if(type==='range'){const spec=rangeSpec(item);setValue(item,menuBase.scroller(Number(state.values[item.key]??spec.initial),spec.min,spec.max,direction,spec.step));render()}else if(type==='select'){const current=Math.max(0,item.choices.indexOf(state.values[item.key]||item.choices[0]));setValue(item,item.choices[menuBase.scroller(current,0,item.choices.length-1,direction)]);render()}else if(type==='toggle'){setValue(item,!state.values[item.key]);render()}}

function chooseSection(si){rememberScreen();state.favOnly=false;state.recentOnly=false;state.advanced=false;state.memory[state.section+':'+state.group]=state.selected;state.section=si;state.group=-1;state.query='';$('search').value='';state.catalog=null;state.selected=state.memory[si+':-1']||0;render()}

function nativeConfigFiles(){

 if(native.length!==190)throw new Error('O catálogo do PRX mudou. Exportação bloqueada para preservar favoritos.');
 const files={};for(let slot=0;slot<3;slot++){
  const chosen=slot===active,flags=native.map(item=>chosen&&state.favorites.has(item.key)?'1':'0').join('');
  files['data/GoldHEN/BXGTA/profile'+slot+'.ini']='BXGTA_PROFILE_V1\ntheme='+(chosen?prefs.theme:0)+'\naccent='+(chosen?prefs.accent:0)+'\nfavorites=00000000\nrecent=\nquery='+(chosen?prefs.query:'veiculo')+'\n';
