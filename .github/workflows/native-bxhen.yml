name: BX-HEN Neon — Native PS4 UI Test PKG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-bxhen/**'
      - '.github/workflows/native-bxhen.yml'
permissions:
  contents: read
jobs:
  build-test-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Neon menu and read-only behavior
        run: node --test native-bxhen/native-bxhen.test.cjs
      - name: Fetch OpenOrbis official samples
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git native-bxhen/upstream
          git -C native-bxhen/upstream sparse-checkout set samples
          test -s native-bxhen/upstream/samples/font/Makefile
          test -s native-bxhen/upstream/samples/input/input/controller.cpp
          test -s native-bxhen/upstream/samples/_common/graphics.cpp
      - name: Fetch OpenOrbis packaging tools
        run: |
          set -euo pipefail
          mkdir -p native-bxhen/tool-bins/fself native-bxhen/tool-bins/gp4
          curl -fLsS --retry 3 https://github.com/OpenOrbis/create-fself/releases/download/v1.3/binaries.tar.gz -o /tmp/bx-neon-fself.tar.gz
          curl -fLsS --retry 3 https://github.com/OpenOrbis/create-gp4/releases/download/v1.0/binaries.tar.gz -o /tmp/bx-neon-gp4.tar.gz
          tar -xzf /tmp/bx-neon-fself.tar.gz -C native-bxhen/tool-bins/fself
          tar -xzf /tmp/bx-neon-gp4.tar.gz -C native-bxhen/tool-bins/gp4
      - name: Build independent PS4 homebrew UI
        run: |
          set -euo pipefail
          docker run --rm --user 0 \
            -v "$PWD:/workspace" -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -ec '
              set -e
              test -d native-bxhen/upstream/samples/font
              mkdir -p native-bxhen/font
              cp -a native-bxhen/upstream/samples/font/. native-bxhen/font/
              cp -a native-bxhen/upstream/samples/_common native-bxhen/_common
              cp native-bxhen/main.cpp native-bxhen/font/font/main.cpp
              cp native-bxhen/upstream/samples/input/input/controller.h native-bxhen/font/font/controller.h
              cp native-bxhen/upstream/samples/input/input/controller.cpp native-bxhen/font/font/controller.cpp
              cd native-bxhen/font
              sed -i "s/OpenOrbis Font Sample/BX-HEN Neon Test/g" Makefile
              sed -i "s/BREW00081/BXHN00001/g" Makefile
              sed -i "s/FONTDRAWEX000000/BXHENNEONMENU001/g" Makefile
              sed -i "s/VERSION     := 1.01/VERSION     := 0.01/g" Makefile
              sed -i "s/-lSceFreeType/-lSceFreeType -lScePad -lSceUserService/g" Makefile
              sed -i "s@sce_sys/about/right.sprx @@g" Makefile
              sed -i "s@^COMMONDIR.*@COMMONDIR   := ../_common@" Makefile
              sed -i "s@^COMMONFILES.*@COMMONFILES := ../_common/graphics.cpp@" Makefile
              sed -i "s@ORBIS_SYSMODULE_FREETYPE_OL@0x009A@g" ../_common/graphics.cpp
              cp ../tool-bins/fself/bin/linux/create-fself "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
              cp ../tool-bins/gp4/bin/linux/create-gp4 "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
              chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
              make -j2
            '
      - name: Verify generated experimental package
        run: |
          set -euo pipefail
          test -s native-bxhen/font/IV0000-BXHN00001_00-BXHENNEONMENU001.pkg
          sha256sum native-bxhen/font/*.pkg | tee native-bxhen/font/SHA256SUMS.txt
      - name: Upload separate homebrew application test artifact
        uses: actions/upload-artifact@v4
        with:
          name: BX-HEN-Neon-0.1-PS4-Test-PKG
          path: |
            native-bxhen/font/IV0000-BXHN00001_00-BXHENNEONMENU001.pkg
            native-bxhen/font/SHA256SUMS.txt
          retention-days: 14
