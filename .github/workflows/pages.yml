name: Build BX-CT7 PS4 Host
on:
  workflow_dispatch:
  # 08:00, 14:00 and 20:00 America/Cuiaba (UTC-4, no DST).
  # Scheduled rebuild verifies pinned sources and republishes the current version;
  # it does not automatically invent or merge code changes.
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 0 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: bx-ct7-pages-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test browser regressions
        run: node --test tests/*.test.cjs
      - name: Test presentation and cache regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild pinned upstream
        run: python3 build.py
      - name: Verify generated language, HEN selection and offline dependencies (no execution)
        run: node --test tests/*.integration.cjs
      - name: Verify BX-HEN dashboard assets
        run: |
          test -s dist/bx-hen/index.html
          test -s dist/bx-hen/extras.css
          test -s dist/bx-hen/extras.js
          grep -q 'BX-HEN 0.2' dist/bx-hen/index.html
          grep -q 'Não implementado' dist/bx-hen/index.html
      - name: Verify source integrity, line endings, links and PKG catalog
        run: python3 diagnostics/verify_site.py
      - name: Generate sanitized BX-HEN test history
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 diagnostics/generate_report.py
          python3 -c "from pathlib import Path; from presentation import stamp_manifests; stamp_manifests(Path('dist'))"
      - name: Upload BX-HEN test report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bx-hen-ci-report-${{ github.run_id }}
          path: diagnostics/latest-report.json
          retention-days: 90
      - name: Publish static artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true  # Preserve .nojekyll in the Pages archive.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    # The deploy-pages action caps its timeout input at 600000 ms (10 minutes).
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          timeout: 600000  # Maximum accepted by deploy-pages@v4
