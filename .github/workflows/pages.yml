name: Build BX-CT7 PS4 Host
on:
  workflow_dispatch:
  # 08:00, 14:00 and 20:00 America/Cuiaba (UTC-4, no DST).
  # Scheduled rebuild verifies pinned sources and republishes the current version;
  # it does not automatically invent or merge code changes.
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 0 * * *'
  push:
    branches: [main]
concurrency:
  group: bx-ct7-pages
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test BX-HEN Core 0.1
        run: node --test tests/bx-hen-core.test.cjs
      - name: Rebuild pinned upstream
        run: python3 build.py
      - name: Verify BX-HEN dashboard assets
        run: |
          test -s dist/bx-hen/index.html
          test -s dist/bx-hen/extras.css
          test -s dist/bx-hen/extras.js
          grep -q 'BX-HEN 0.2' dist/bx-hen/index.html
          grep -q 'Não implementado' dist/bx-hen/index.html
      - name: Verify source integrity, line endings, links and PKG catalog
        run: python3 diagnostics/verify_site.py
      - name: Generate sanitized BX-HEN test history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 diagnostics/generate_report.py
      - name: Upload BX-HEN test report
        uses: actions/upload-artifact@v4
        with:
          name: bx-hen-ci-report-${{ github.run_id }}
          path: diagnostics/latest-report.json
          retention-days: 90
      - name: Sync public Cloudflare BX-HEN site (fallback to existing dashboard)
        run: python3 diagnostics/sync_cloudflare_public.py
      - name: Verify public BX-HEN after sync
        run: |
          test -s dist/bx-hen/index.html
          test -s dist/bx-hen/core.js
          if grep -q '0.5.4-private-tests' dist/bx-hen/index.html; then
            ! grep -q 'href="/teste/"' dist/bx-hen/index.html
          fi
      - name: Publish static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
