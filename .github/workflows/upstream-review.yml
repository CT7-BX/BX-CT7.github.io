name: Review WebKitty updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build.py
      - scripts/upstream_update.py
      - .github/workflows/upstream-review.yml
  schedule:
    - cron: '20 */6 * * *'
permissions:
  contents: read
concurrency:
  group: webkitty-upstream-review
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check for a newer upstream revision
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream_update.py
      - name: Validate candidate without publishing
        if: steps.candidate.outputs.changed == 'true'
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 build.py
          node --test tests/*.integration.cjs
          python3 diagnostics/verify_site.py
      - name: Save validated proposal
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: webkitty-proposal
          path: |
            upstream-candidate.txt
            upstream-review.md
          retention-days: 14
  propose:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: webkitty-proposal
          path: proposal
      - name: Open proposal for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$(cat proposal/upstream-candidate.txt)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          branch="updates/webkitty-$revision"
          existing="$(gh pr list --head "$branch" --state all --json number --jq 'length')"
          if [ "$existing" != 0 ]; then
            echo 'This revision already has a review proposal.'
            exit 0
          fi
          python3 scripts/upstream_update.py --apply "$revision"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.py
          git commit -m "Propose reviewed WebKitty revision $revision"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Review WebKitty update ${revision:0:7}" --body-file proposal/upstream-review.md
